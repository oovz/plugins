schema_version: "1.0.0"
run_id: "<stable run ID>"
task_id: "<stable task or milestone ID>"
state_path: "./state.md"
updated_at: "<UTC timestamp>"

# Finding item fields:
# id, severity (critical|warning), source, claim, evidence,
# violated_requirement, status (open|still-open|fixed|superseded-by-accepted-decision), owner
findings: []

# Attempt item fields:
# attempt_id, finding_ids, failure_classification, decisive_reproduction,
# causal_chain, rejected_hypotheses_with_evidence, applied_fix,
# engineer_validation, tester_rerun, progress_delta
attempts: []

# Closure item fields:
# id, finding_ids, status, fix_or_decision_reference, tester_evidence,
# reviewer_evidence, closed_at
closures: []

# Accepted-decision item fields, used only for superseded-by-accepted-decision:
# id, finding_ids, owner (must be user), rationale, scope, residual_consequence, accepted_at
accepted_decisions: []
