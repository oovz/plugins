name: Release @oovz/sew

on:
  push:
    tags:
      - "sew-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to restore as npm latest
        required: true
        type: string

concurrency:
  group: release-sew-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    if: github.repository == 'oovz/plugins' && github.event_name == 'push'
    uses: ./.github/workflows/validate-reusable.yml

  build:
    if: github.repository == 'oovz/plugins'
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify repository
        run: npm run verify

      - name: Build and pack release package
        env:
          SEW_SOURCE_COMMIT: ${{ github.sha }}
        run: npm run pack:sew

      - name: Verify source commit identity
        env:
          SEW_SOURCE_COMMIT: ${{ github.sha }}
        run: test "$SEW_SOURCE_COMMIT" = "$(git rev-parse HEAD)"

      - name: Verify tag and release bundle
        run: node scripts/check-sew-release.mjs "$GITHUB_REF_NAME"

      - name: Upload the immutable candidate tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sew-release-${{ github.ref_name }}
          path: |
            release-build/sew/artifacts/*.tgz
            release-build/sew/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  smoke:
    if: github.repository == 'oovz/plugins'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out tagged source for the smoke runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked smoke-runner dependencies
        run: npm ci

      - name: Download the exact candidate tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sew-release-${{ github.ref_name }}
          path: release-build/sew/artifacts

      - name: Smoke the npm-installed command and every host configuration
        run: node scripts/smoke-sew-release.mjs release-build/sew/artifacts

  release:
    if: github.repository == 'oovz/plugins'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sew-release-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source and release history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use a trusted-publishing-capable npm CLI
        run: npm install --global npm@11.5.1

      - name: Install locked release-tool dependencies
        run: npm ci

      - name: Download the candidate tarball tested on every platform
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sew-release-${{ github.ref_name }}
          path: release-build/sew/artifacts

      - name: Verify downloaded release checksum
        working-directory: release-build/sew/artifacts
        run: sha256sum --check SHA256SUMS.txt

      - name: Prepare commit notes and version-aware publication
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SEW_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > release-build/sew/releases.json
          npm view @oovz/sew versions --json > release-build/sew/npm-versions.json
          node scripts/prepare-sew-release.mjs "$GITHUB_REF_NAME" "$GH_REPO" \
            release-build/sew/releases.json release-build/sew/npm-versions.json \
            release-build/sew/metadata

      - name: Publish the tested CI-built tarball to npm
        shell: bash
        env:
          NPM_RELEASE_TAG: ${{ steps.metadata.outputs.npm_tag }}
        run: |
          mapfile -t tarballs < <(find release-build/sew/artifacts -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          npm publish "${tarballs[0]}" --access public --provenance --tag "$NPM_RELEASE_TAG"

      - name: Create GitHub Release from the same tested bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_SOURCE: ${{ steps.metadata.outputs.source_commit }}
          RELEASE_LATEST: ${{ steps.metadata.outputs.make_latest }}
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          mapfile -t tarballs < <(find release-build/sew/artifacts -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          gh release create "$GITHUB_REF_NAME" \
            "${tarballs[0]}" \
            release-build/sew/artifacts/SHA256SUMS.txt \
            --verify-tag \
            --target "$RELEASE_SOURCE" \
            --notes-file release-build/sew/metadata/notes.md \
            --latest="$RELEASE_LATEST" \
            --prerelease="$RELEASE_PRERELEASE" \
            --title "@oovz/sew $RELEASE_VERSION"

  promote:
    name: Repair npm latest for a published release
    if: github.repository == 'oovz/plugins' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sew-release-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tooling and tag history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0

      - name: Install locked release-tool dependencies
        run: npm ci

      - name: Resolve the published version and source
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-build/sew
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > release-build/sew/releases.json
          npm view @oovz/sew versions --json > release-build/sew/npm-versions.json
          node scripts/prepare-sew-release.mjs "$RELEASE_TAG" "$GH_REPO" \
            release-build/sew/releases.json release-build/sew/npm-versions.json \
            release-build/sew/metadata

      - name: Verify package identity and repair npm latest
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          npm view "@oovz/sew@$RELEASE_VERSION" name version sourceCommit roleSourceVersion --json > release-build/sew/published-package.json
          node scripts/check-sew-promotion.mjs release-build/sew/metadata/plan.json release-build/sew/published-package.json
          npm dist-tag add "@oovz/sew@$RELEASE_VERSION" latest
          test "$(npm view @oovz/sew dist-tags.latest)" = "$RELEASE_VERSION"
