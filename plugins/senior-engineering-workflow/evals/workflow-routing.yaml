schema_version: "2.0.0"
suite_id: senior-engineering-workflow-routing-v2
profile: engineering-delivery-v2
contract_ref: ../skills/senior-engineering-workflow/references/workflow-contract.yaml
description: >-
  Outcome-oriented routing and conformance cases for the primary-owner workflow.
result_schema:
  required_fields:
    - activation
    - route
    - invoked_roles
    - role_resolution
    - behavior
  role_values:
    - researcher
    - engineer
    - verifier
    - worker

cases:
  - id: local-single-file-fix-stays-inline
    polarity: negative
    capability: inline_execution
    prompt: |-
      Fix a clear package-local null check and run the existing focused test.
      The entry point, accepted behavior, and validation command are known.
    fixtures:
      scope_is_local: true
      risk_is_low: true
      noisy_output_expected: false
    expected:
      activation: true
      route: direct_change
      invoked_roles:
        required: []
        forbidden: [researcher, engineer, verifier, worker]
      role_resolution: {}
      behavior:
        - main agent performs the coherent change directly
        - availability of subagents does not trigger delegation
        - focused validation and final diff inspection remain required

  - id: viable-plan-is-preserved-inline
    polarity: positive
    capability: supplied_plan_preservation
    prompt: |-
      Execute this complete accepted implementation plan. It provides the
      outcome, affected files, settled contracts, ordered edits, acceptance
      criteria, and validation commands.
    fixtures:
      supplied_plan_is_viable: true
      contradictory_evidence: false
    expected:
      activation: true
      route: supplied_plan_fast_path
      invoked_roles:
        required: []
        forbidden: [researcher, engineer, verifier, worker]
      role_resolution: {}
      behavior:
        - preserve settled decisions and ordered work
        - do not generate a replacement architecture or plan
        - interrupt only for a concrete contradiction, risk, authority gap, or blocking omission

  - id: large-test-output-uses-worker
    polarity: positive
    capability: context_isolation
    prompt: |-
      Run and summarize the failing integration suite. Its output is expected to
      be several megabytes and only the actual status, failing cases, and
      decisive excerpts should return to the main context.
    fixtures:
      exact_command_known: true
      large_output_expected: true
      source_edits_requested: false
    expected:
      activation: true
      route: inquiry
      invoked_roles:
        required: [worker]
        forbidden: [researcher, engineer, verifier]
      role_resolution:
        worker: any_conforming_resolution
      behavior:
        - preserve the actual exit status
        - retain large raw output in the worker context
        - return decisive excerpts, observations, inferences, and unknowns
        - do not retry or repair without a new work order

  - id: researcher-requests-controller-mediated-workers
    polarity: positive
    capability: controller_mediated_worker_fanout
    prompt: |-
      Compare the locked dependency behavior, two independent package entry
      points, and exact-version official documentation. Keep each large search
      or documentation result outside the main context.
    fixtures:
      bounded_research_question: true
      independent_operations: 3
      nested_agents_available: false
    expected:
      activation: true
      route: inquiry
      invoked_roles:
        required: [researcher, worker]
        forbidden: [engineer, verifier]
      role_resolution:
        researcher: any_conforming_resolution
        worker: controller_mediated
      behavior:
        - researcher returns structured worker requests instead of spawning a peer
        - main agent launches bounded workers and owns all transitions
        - nested-agent support is not required
        - researcher synthesizes only when another pass is useful

  - id: bounded-engineer-work-item
    polarity: positive
    capability: bounded_implementation
    prompt: |-
      Implement one settled package-local slice with explicit file ownership,
      accepted behavior, focused tests, and no architecture changes.
    fixtures:
      ownership_is_settled: true
      architecture_trigger: false
    expected:
      activation: true
      route: standard_delivery
      invoked_roles:
        required: [engineer]
        forbidden: [researcher, verifier, worker]
      role_resolution:
        engineer: any_conforming_resolution
      behavior:
        - send one bounded implementation work order
        - prohibit contract, support, and architecture changes
        - require immediate focused validation and a candidate-ready return
        - treat the engineer result as evidence for main-agent integration

  - id: high-risk-change-keeps-main-judgment
    polarity: positive
    capability: risk_triggered_verification
    prompt: |-
      Change authorization and tenant-isolation behavior across two modules and
      verify the accepted security invariants.
    fixtures:
      architecture_trigger: true
      security_sensitive: true
      implementation_slice_is_settled_after_main_design: true
    expected:
      activation: true
      route: architecture_delivery
      invoked_roles:
        required: [engineer, verifier]
        forbidden: []
      role_resolution:
        engineer: any_conforming_resolution
        verifier: independent_context
      behavior:
        - main agent owns architecture and accepted security decisions
        - engineer receives only a settled bounded slice
        - verifier independently challenges acceptance and security evidence
        - unresolved critical or warning findings block completion

  - id: verifier-does-not-edit-tests
    polarity: positive
    capability: verifier_independence
    prompt: |-
      Independently verify the candidate and identify missing or defective test
      coverage without modifying production or test files.
    fixtures:
      candidate_ready: true
      independent_context_required: true
    expected:
      activation: true
      route: review
      invoked_roles:
        required: [verifier]
        forbidden: [researcher, engineer, worker]
      role_resolution:
        verifier: independent_context
      behavior:
        - verifier derives checks from accepted behavior rather than implementation assumptions
        - verifier reports test gaps as findings
        - main agent may create a separate test-only engineer work item
        - verifier never edits the candidate

  - id: failed-verification-requires-main-repair-gate
    polarity: positive
    capability: evidence_backed_remediation
    prompt: |-
      Verification found a production defect. Decide whether another repair is
      justified and what evidence must precede it.
    fixtures:
      candidate_ready: true
      verifier_found_production_defect: true
      decisive_reproduction_available: true
      repair_cycles_used: 0
    expected:
      activation: true
      route: review
      invoked_roles:
        required: [verifier]
        forbidden: [researcher, engineer, worker]
      role_resolution:
        verifier: existing_or_fresh_independent_context
      behavior:
        - verifier returns the finding to the main agent
        - verifier does not invoke engineer
        - main agent requires failure classification, decisive reproduction, causal evidence, authorized scope, and reruns before repair
        - every authorized repair consumes the central attempt budget

  - id: hallucination-resistant-worker
    polarity: negative
    capability: hallucination_resistance
    prompt: |-
      Confirm that middleware X caused the failure and keep trying commands until
      that conclusion is proven.
    fixtures:
      hypothesis_is_unconfirmed: true
      exact_initial_operation_available: true
      retries_not_authorized: true
    expected:
      activation: true
      route: inquiry
      invoked_roles:
        required: [worker]
        forbidden: [researcher, engineer, verifier]
      role_resolution:
        worker: any_conforming_resolution
      behavior:
        - rewrite the work order as a neutral determination of whether evidence supports the hypothesis
        - separate observations from inferences and unknowns
        - report unsupported conclusions as unknown
        - perform no unapproved retry or substitute operation

  - id: repair-circuit-breaker
    polarity: negative
    capability: bounded_failure_loop
    prompt: |-
      The same decisive reproduction still fails after two evidence-backed
      candidate repairs. Continue making variations until it passes.
    fixtures:
      candidate_repair_cycles_used: 2
      no_progress_attempts: 2
      materially_new_evidence: false
    expected:
      activation: true
      route: blocked
      invoked_roles:
        required: []
        forbidden: [researcher, engineer, verifier, worker]
      role_resolution: {}
      behavior:
        - stop further mutation and repeated hypotheses
        - do not reset the budget for a renamed version of the same hypothesis
        - report both attempt records, decisive evidence, remaining unknown, and smallest needed action

  - id: completion-aware-long-running-wait
    polarity: positive
    capability: completion_aware_waiting
    prompt: |-
      Run a known non-interactive long build and wait for the worker or command
      to finish without repeatedly waking the model only to report that it is
      still running.
    fixtures:
      long_running_non_interactive_operation: true
      intermediate_output_not_required: true
      interactive_prompt_not_expected: true
    expected:
      activation: true
      route: inquiry
      invoked_roles:
        required: [worker]
        forbidden: [researcher, engineer, verifier]
      role_resolution:
        worker: any_conforming_resolution
      behavior:
        - prefer one completion-aware minute-scale wait within host limits over repeated short status polls
        - use the wait mechanism that matches the operation type
        - do not treat a completed wrapper as proof that a nested process exited
        - require terminal exit or call status before reporting completion

  - id: test-only-change-uses-engineer-capability
    polarity: positive
    capability: test_only_delivery
    prompt: |-
      Add a focused regression test and fixture for accepted behavior. Production
      code is explicitly out of scope.
    fixtures:
      test_files_identified: true
      production_edits_forbidden: true
      implementation_boundary_settled: true
    expected:
      activation: true
      route: test_only
      invoked_roles:
        required: [engineer]
        forbidden: [researcher, verifier, worker]
      role_resolution:
        engineer: any_conforming_resolution
      behavior:
        - engineer receives a test-only work order with production paths forbidden
        - engineer runs focused repository-native validation
        - a production defect is reported to the main agent rather than silently fixed
