schema_version: "3.0.0"
contract_id: senior-engineering-workflow
contract_version: "3.2.0"
profile: engineering-delivery-v3
description: Reference policy for direct engineering ownership and optional specialists; reviewed alongside the skill and role instructions.

controller:
  kind: primary_engineering_owner
  is_leaf_role: false
  responsibilities:
    - accepted scope and user decisions
    - architecture and integration
    - proportionate delegation and verification
    - evidence-based iteration and completion
    - validation selection and policy handoff
    - preserve accepted decisions and disposition reviewer findings

leaf_role_count: 3
leaf_roles:
  researcher:
    logical_agent_id: researcher
    is_leaf: true
    delegates: false
    reports_to: controller
    may_write_production_files: false
    may_write_test_files: false
    runs_own_tools: true
  engineer:
    logical_agent_id: engineer
    is_leaf: true
    delegates: false
    reports_to: controller
    may_write_production_files: true
    may_write_test_files: true
    runs_own_tools: true
    deliverables: [code, configuration, ci, deployment_artifacts, design, documentation]
  verifier:
    logical_agent_id: verifier
    is_leaf: true
    delegates: false
    reports_to: controller
    may_write_production_files: false
    may_write_test_files: false
    runs_own_tools: true

execution:
  default: direct
  preserve_viable_supplied_plan: true
  implementation_owns_immediate_validation: true
  concurrent_writers_require_disjoint_ownership_or_isolation: true
  integrated_candidate_requires_validation: true
  inquiries_and_reviews_are_read_only: true
  selected_workflow_transitions_owned_by: controller
  selected_workflow_gates: preserve_unless_explicitly_adapted
  accepted_decisions_survive_workflow_transitions: true
  reopen_decisions_for: new_evidence_changing_consequences_contradictions_or_evidence_gaps
  additional_mechanisms_require: accepted_requirement_supported_path_failure_or_relevant_boundary
  additional_failure_handling_requires: existing_failure_behavior_is_inadequate
  established_internal_invariants: rely_unless_evidence_shows_bypass_or_invalid_assumption

context:
  advertised_capacity_is_not_a_routing_threshold: true
  retain_relevant_connected_evidence: true
  verbose_output: scoped_artifacts_and_targeted_retrieval
  durable_state_trigger: likely_interruption_or_session_boundary
  summaries_retain_evidence_locations: true

delegation:
  availability_is_not_a_trigger: true
  inline_execution_is_first_class: true
  required_work_order: references/delegation-and-state.md
  specialist_may_invoke_agents: false
  benefit_must_justify_coordination_cost: true
  minimum_specialist_packet:
    - objective_and_acceptance
    - scope_and_authority
    - applicable_policies_and_authorized_skills
    - relevant_context
    - checks_and_stop_conditions
    - evidence_and_limitations_return
  identifiers: when_needed_for_concurrent_or_resumable_work
  work_order_format: plain_language_or_structured
  policy_handoff: relevant_reference_or_excerpt_when_not_inherited
  decision_handoff: authoritative_source_with_relevant_limits_deferrals_and_agreed_evidence
  instruction_authority: host_hierarchy_and_applicable_user_or_host_authorized_guidance

runtime_permissions:
  canonical_policy: inherit
  plugin_emitted_host_restrictions:
    default: none
    antigravity:
      tools: explicit_allowlist
      command_execution_policy: sandbox
  behavioral_scope_remains_work_order_bound: true

verification:
  independent_when:
    - explicitly_requested
    - consequential_security_data_loss_or_migration_risk
    - uncertain_acceptance_or_demonstrated_capability_limit
  independent_checks_derive_from: accepted_behavior_and_material_risk
  unavailable_required_independence: disclose_limitation
  verifier_preserves_candidate: true
  change_review_requires: pinned_baseline_and_stable_scoped_candidate
  precommit_candidate_includes: [staged, unstaged, intended_new_files]
  validation_evidence_identifies: actual_candidate_checked
  test_selection: accepted_behavior_credible_failures_and_coverage_gaps
  reuse_adequate_checks: true
  prose_and_copied_settings_assertions: reject_incidental_representation_checks
  configuration_evidence: supported_consumer_and_observable_effects
  exact_assertions_require: independently_established_machine_contract
  review_test_quality: missing_evidence_and_unnecessary_new_tests
  required_gates_remain_required: true
  evidence_selection: accepted_outcome_deliverable_and_remaining_gaps
  standalone_design_and_documentation: artifact_evidence_preserving_explicit_repository_release_and_affected_executable_gates
  composed_test_seam: lowest_reliable_public_boundary_reusing_approved_seams
  selected_review_satisfies_corresponding_sew_need: true
  selected_review_axes_and_independence: preserve
  finding_dispositions: [defect, accepted_limitation, optional_improvement, unresolved_question]
  defect_requires: reachable_condition_violated_requirement_or_invariant_evidence_and_consequence
  accepted_limitation_requires: established_decision_or_support_boundary
  disposition_owner: controller_preserving_original_reviewer_assessment
  repair_review_scope: named_findings_and_affected_behavior_broaden_for_concrete_reason
  clean_review_is_valid: true
  modes: [acceptance, review, design-challenge, closure]

iteration:
  new_evidence_required_for_repeat: true
  repeated_no_progress: reassess_hypothesis_and_design
  experiment_limits: proportional_to_cost_and_risk
  continue_useful_authorized_diagnosis: true
  failure_classes: [production_defect, test_defect, environment_issue, contract_or_design_ambiguity]

long_running_operations:
  avoid_status_only_polling: true
  prefer_completion_aware_waits: true
  terminal_status_required_for_completion: true
  respect_host_limits_and_communication_needs: true

completion:
  observed_evidence_required: true
  final_diff_review_required: true
  unrun_checks_may_not_be_reported_as_passed: true
  material_findings_require_resolution_or_explicit_acceptance: true
  distinguish_structural_behavioral_native_and_release_evidence: true
  ordinary_undiscovered_defect_uncertainty_permits_completion: true
  optional_improvements_do_not_block: true

writing:
  target: actual_behavior_decisions_reasons_and_required_actions
  qualifications: when_affecting_reader_decisions_or_resolving_ambiguity
  product_documentation: audience_relevant_behavior
  internal_workflow_guidance: agent_instructions_or_relevant_engineering_notes
